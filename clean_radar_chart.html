<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Radar Chart</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 1200px;
            background: #ffffff;
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid #e9ecef;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .main-title {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #6c757d;
            font-weight: 400;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 500px 1fr;
            gap: 50px;
            align-items: center;
        }

        .radar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-container {
            position: relative;
            width: 500px;
            height: 500px;
            background: #f8f9fa;
            border-radius: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #e9ecef;
        }

        .radar-svg {
            width: 450px;
            height: 450px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #f8f9fa;
            border-radius: 20px;
            border: 1px solid #e9ecef;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .legend-text {
            font-size: 14px;
            font-weight: 500;
            color: #495057;
        }

        .data-panel {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .score-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-radius: 25px;
            padding: 35px;
            text-align: center;
            border: 2px solid #667eea;
        }

        .score-label {
            font-size: 16px;
            color: #6c757d;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .score-value {
            font-size: 56px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .metrics-list {
            display: grid;
            gap: 15px;
        }

        .metric-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 1px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .metric-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .metric-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            flex-shrink: 0;
            color: #ffffff;
        }

        .metric-item:nth-child(1) .metric-icon {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
        }

        .metric-item:nth-child(2) .metric-icon {
            background: linear-gradient(135deg, #4fc3f7 0%, #29b6f6 100%);
        }

        .metric-item:nth-child(3) .metric-icon {
            background: linear-gradient(135deg, #66bb6a 0%, #4caf50 100%);
        }

        .metric-item:nth-child(4) .metric-icon {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
        }

        .metric-info {
            flex: 1;
        }

        .metric-name {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
        }

        @media (max-width: 1200px) {
            .container {
                width: 95%;
                padding: 30px;
            }

            .content-wrapper {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="main-title">Performance Radar Analysis</h1>
            <p class="subtitle">Multi-dimensional Performance Assessment</p>
        </div>

        <div class="content-wrapper">
            <!-- Radar Chart -->
            <div class="radar-section">
                <div class="chart-container">
                    <svg class="radar-svg" viewBox="0 0 450 450">
                        <!-- Background circles -->
                        <g id="circles">
                            <circle cx="225" cy="225" r="45" fill="none" stroke="#e9ecef" stroke-width="1"/>
                            <circle cx="225" cy="225" r="90" fill="none" stroke="#e9ecef" stroke-width="1"/>
                            <circle cx="225" cy="225" r="135" fill="none" stroke="#e9ecef" stroke-width="1"/>
                            <circle cx="225" cy="225" r="180" fill="none" stroke="#e9ecef" stroke-width="1"/>
                        </g>

                        <!-- Axis lines -->
                        <g id="axes">
                            <line x1="225" y1="225" x2="225" y2="45" stroke="#dee2e6" stroke-width="2"/>
                            <line x1="225" y1="225" x2="374.91" y2="141.03" stroke="#dee2e6" stroke-width="2"/>
                            <line x1="225" y1="225" x2="308.97" y2="374.91" stroke="#dee2e6" stroke-width="2"/>
                            <line x1="225" y1="225" x2="75.09" y2="308.97" stroke="#dee2e6" stroke-width="2"/>
                        </g>

                        <!-- Scale labels -->
                        <g id="labels" font-family="Inter" font-size="12" fill="#6c757d">
                            <text x="225" y="35" text-anchor="middle">100</text>
                            <text x="225" y="80" text-anchor="middle">75</text>
                            <text x="225" y="125" text-anchor="middle">50</text>
                            <text x="225" y="170" text-anchor="middle">25</text>
                        </g>

                        <!-- Dimension labels -->
                        <g id="dimension-labels" font-family="Inter" font-size="16" font-weight="600" fill="#2c3e50">
                            <text x="225" y="20" text-anchor="middle">Precision</text>
                            <text x="400" y="135" text-anchor="middle">Speed</text>
                            <text x="340" y="400" text-anchor="middle">Robustness</text>
                            <text x="60" y="330" text-anchor="middle">Compliance</text>
                        </g>

                        <!-- Baseline data polygon -->
                        <g id="baseline">
                            <polygon points="225,58.5 332.43,160.43 294.07,357.57 102.43,274.93"
                                     fill="rgba(149, 165, 166, 0.1)"
                                     stroke="#95a5a6"
                                     stroke-width="2"/>
                        </g>

                        <!-- Our data polygon -->
                        <g id="our-data">
                            <polygon points="225,58.5 316.13,172.67 301.05,324.75 87.75,297.75"
                                     fill="rgba(102, 126, 234, 0.3)"
                                     stroke="url(#gradient)"
                                     stroke-width="3"/>

                            <!-- Data points -->
                            <circle cx="225" cy="58.5" r="5" fill="#667eea"/>
                            <circle cx="316.13" cy="172.67" r="5" fill="#667eea"/>
                            <circle cx="301.05" cy="324.75" r="5" fill="#667eea"/>
                            <circle cx="87.75" cy="297.75" r="5" fill="#667eea"/>
                        </g>

                        <!-- Gradient definition -->
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>

                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: url(#gradient);"></div>
                        <span class="legend-text">Our Algorithm</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #95a5a6;"></div>
                        <span class="legend-text">Baseline</span>
                    </div>
                </div>
            </div>

            <!-- Data Panel -->
            <div class="data-panel">
                <div class="score-card">
                    <div class="score-label">Overall Score</div>
                    <div class="score-value">84.89</div>
                </div>

                <div class="metrics-list">
                    <div class="metric-item">
                        <div class="metric-icon">🎯</div>
                        <div class="metric-info">
                            <div class="metric-name">Detection Accuracy</div>
                            <div class="metric-value">99.2%</div>
                        </div>
                    </div>

                    <div class="metric-item">
                        <div class="metric-icon">🔗</div>
                        <div class="metric-info">
                            <div class="metric-name">Connection Accuracy</div>
                            <div class="metric-value">95.65%</div>
                        </div>
                    </div>

                    <div class="metric-item">
                        <div class="metric-icon">✓</div>
                        <div class="metric-info">
                            <div class="metric-name">Compliance Rate</div>
                            <div class="metric-value">100%</div>
                        </div>
                    </div>

                    <div class="metric-item">
                        <div class="metric-icon">⚡</div>
                        <div class="metric-info">
                            <div class="metric-name">Inference Speed</div>
                            <div class="metric-value">~1.5s</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
