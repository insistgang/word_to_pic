<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG威胁情报功能测试结果</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .chart-container {
            position: relative;
            margin: 20px 0;
            height: 400px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .summary h2 {
            margin-top: 0;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        .highlight {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        .highlight-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RAG威胁情报功能测试结果</h1>

        <div class="summary">
            <h2>测试概况</h2>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number">50</div>
                    <div class="stat-label">语义检索测试样本</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">90%</div>
                    <div class="stat-label">情报检索相关性</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">1000</div>
                    <div class="stat-label">情报增强测试样本</div>
                </div>
            </div>
        </div>

        <div class="highlight">
            <div>RAG技术带来的准确率提升</div>
            <div class="highlight-value">+8.3%</div>
            <div>零日攻击变体准确率提升 +12%</div>
        </div>

        <div class="chart-container">
            <canvas id="ragComparisonChart"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('ragComparisonChart').getContext('2d');

        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['禁用RAG', '启用RAG'],
                datasets: [{
                    label: '分析准确率',
                    data: [88.5, 96.8],
                    backgroundColor: [
                        'rgba(231, 76, 60, 0.8)',
                        'rgba(46, 204, 113, 0.8)'
                    ],
                    borderColor: [
                        'rgba(231, 76, 60, 1)',
                        'rgba(46, 204, 113, 1)'
                    ],
                    borderWidth: 2,
                    barPercentage: 0.6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: 'RAG技术对威胁分析准确性的增强效果',
                        font: {
                            size: 18,
                            weight: 'bold'
                        },
                        padding: 20
                    },
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return '准确率: ' + context.parsed.y + '%';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'RAG模式',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        },
                        ticks: {
                            font: {
                                size: 13
                            }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        max: 100,
                        title: {
                            display: true,
                            text: '分析准确率 (%)',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        },
                        ticks: {
                            callback: function(value) {
                                return value + '%';
                            },
                            font: {
                                size: 12
                            }
                        }
                    }
                },
                animation: {
                    duration: 1500,
                    easing: 'easeOutBounce'
                }
            }
        });

        // 添加数据标签
        const originalDraw = chart.draw;
        chart.draw = function() {
            originalDraw.apply(this, arguments);

            const ctx = this.ctx;
            ctx.font = 'bold 14px Microsoft YaHei';
            ctx.fillStyle = '#2c3e50';
            ctx.textAlign = 'center';

            const meta = this.getDatasetMeta(0);
            meta.data.forEach((bar, index) => {
                const data = this.data.datasets[0].data[index];
                ctx.fillText(data + '%', bar.x, bar.y - 10);
            });
        };
    </script>
</body>
</html>
