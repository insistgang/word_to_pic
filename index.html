<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>低空经济数据看板</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f6f8; color: #172033; font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
    main { max-width: 920px; margin: 0 auto; padding: 48px 20px 72px; }
    h1 { margin: 8px 0; font-size: clamp(2rem, 5vw, 2.7rem); letter-spacing: -.03em; }
    .lead { max-width: 40rem; color: #5d6b82; line-height: 1.7; }
    .note { display: inline-block; margin-top: 8px; background: #e8eef6; color: #1e3a5f; border-radius: 999px; padding: 4px 10px; font-size: 12px; }
    ol { list-style: none; margin: 28px 0 0; padding: 0; counter-reset: n; }
    li { counter-increment: n; border-top: 1px solid #e3e8ef; }
    a { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: start; padding: 16px 0; color: inherit; text-decoration: none; }
    a::before { content: counter(n, decimal-leading-zero); color: #94a3b8; font-size: 12px; padding-top: 3px; }
    h2 { margin: 0 0 4px; font-size: 16px; }
    p { margin: 0; color: #5d6b82; font-size: 13px; line-height: 1.55; }
    .go { color: #1d4ed8; font-size: 13px; white-space: nowrap; padding-top: 2px; }
    a:hover h2 { color: #1d4ed8; }
    @media (max-width: 640px) { a { grid-template-columns: 28px 1fr; } .go { grid-column: 2; } }
  </style>
</head>
<body>
  <main>
    <p class="note">演示数据，不是运营报表</p>
    <h1>低空经济数据看板</h1>
    <p class="lead">十六个场景页。每页里的数字用于展示图表，不代表真实经营结果。</p>
    <ol id="list"></ol>
  </main>
  <script>
    const items = [
      ["drone-delivery-dashboard.html", "城市生活服务配送", "杨浦三条航线的配送时效和单量，用来演示城市即时配送。"],
      ["medical-drone-dashboard.html", "医疗无人机配送", "血液制品损耗和急救响应时间，用来演示医疗冷链。"],
      ["industrial-drone-dashboard.html", "工业级无人机应用", "金山与苏州园区的制造和运输场景。"],
      ["yangtze-delta-dashboard.html", "长三角特色经济带", "舟山岛际物资运输的航线和需求。"],
      ["market-growth-dashboard.html", "市场增长趋势", "2025 到 2030 年的规模假设。"],
      ["medical-market-dashboard.html", "医疗细分市场", "医院配送费用和医疗市场规模假设。"],
      ["industrial-market-dashboard.html", "工业细分市场", "工业级应用的规模假设。"],
      ["special-industry-dashboard.html", "特色产业物流", "航线数量和货运量的演示。"],
      ["user-profile-dashboard.html", "用户画像分析", "年龄、学历和使用频次的演示画像。"],
      ["merchant-application-dashboard.html", "商家应用格局", "自建运力和共享运力的两种做法。"],
      ["medical-standards-dashboard.html", "医疗机构标准", "医院准入和准点率要求的演示。"],
      ["government-support-dashboard.html", "政府支持体系", "监管和补贴政策的整理。"],
      ["revenue-model-analysis.html", "收入模式分析", "核心收入和补充收入怎么拆。"],
      ["cost-structure-analysis.html", "成本结构分析", "固定、可变和合规成本的演示结构。"],
      ["core-value-proposition.html", "核心价值主张", "不同公司的配送时效说法。"],
      ["dashboard-status-monitor.html", "看板状态", "这些页面的打开情况。"]
    ];
    document.getElementById("list").innerHTML = items.map(([href, title, text]) =>
      `<li><a href="${href}"><div><h2>${title}</h2><p>${text}</p></div><span class="go">打开</span></a></li>`
    ).join("");
  </script>
</body>
</html>
