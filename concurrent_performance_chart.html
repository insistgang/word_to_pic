<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>并发处理能力测试结果</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .chart-container {
            position: relative;
            margin: 20px 0;
            height: 500px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .summary h2 {
            margin-top: 0;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        .performance-highlight {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        .performance-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        .performance-desc {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .chart-row {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .chart-col {
            flex: 1;
        }
        .small-chart {
            height: 350px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>并发处理能力测试结果</h1>

        <div class="summary">
            <h2>测试配置</h2>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number">1小时</div>
                    <div class="stat-label">测试持续时间</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">3个梯度</div>
                    <div class="stat-label">测试梯度</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">1200</div>
                    <div class="stat-label">告警/秒处理能力</div>
                </div>
            </div>
        </div>

        <div class="performance-highlight">
            <div>系统稳定运行范围</div>
            <div class="performance-value">≤150QPS</div>
            <div class="performance-desc">在150QPS以内可保持稳定运行，满足设计目标</div>
        </div>

        <div class="chart-container">
            <canvas id="performanceChart"></canvas>
        </div>

        <div class="chart-row">
            <div class="chart-col">
                <div class="small-chart">
                    <canvas id="responseTimeChart"></canvas>
                </div>
            </div>
            <div class="chart-col">
                <div class="small-chart">
                    <canvas id="resourceChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 主性能对比图表
        const ctx1 = document.getElementById('performanceChart').getContext('2d');
        const performanceChart = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: ['100QPS', '150QPS', '200QPS'],
                datasets: [
                    {
                        label: '响应时间 (ms)',
                        data: [85, 120, 210],
                        backgroundColor: 'rgba(52, 152, 219, 0.8)',
                        borderColor: 'rgba(52, 152, 219, 1)',
                        borderWidth: 2,
                        yAxisID: 'y'
                    },
                    {
                        label: '请求失败率 (%)',
                        data: [0, 0.5, 5],
                        backgroundColor: 'rgba(231, 76, 60, 0.8)',
                        borderColor: 'rgba(231, 76, 60, 1)',
                        borderWidth: 2,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                plugins: {
                    title: {
                        display: true,
                        text: '不同QPS梯度下的系统性能表现',
                        font: {
                            size: 18,
                            weight: 'bold'
                        },
                        padding: 20
                    },
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 15,
                            font: {
                                size: 12
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: '并发负载 (QPS)',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    },
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: {
                            display: true,
                            text: '响应时间 (ms)',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        },
                        max: 250
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: {
                            display: true,
                            text: '请求失败率 (%)',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        },
                        max: 6,
                        grid: {
                            drawOnChartArea: false
                        }
                    }
                }
            }
        });

        // 响应时间趋势图
        const ctx2 = document.getElementById('responseTimeChart').getContext('2d');
        const responseTimeChart = new Chart(ctx2, {
            type: 'line',
            data: {
                labels: ['100QPS', '150QPS', '200QPS'],
                datasets: [{
                    label: '响应时间 (ms)',
                    data: [85, 120, 210],
                    borderColor: 'rgba(52, 152, 219, 1)',
                    backgroundColor: 'rgba(52, 152, 219, 0.2)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 6,
                    pointBackgroundColor: 'rgba(52, 152, 219, 1)',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: '响应时间变化趋势',
                        font: {
                            size: 16,
                            weight: 'bold'
                        }
                    },
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: '响应时间 (ms)'
                        }
                    }
                }
            }
        });

        // 资源利用率图
        const ctx3 = document.getElementById('resourceChart').getContext('2d');
        const resourceChart = new Chart(ctx3, {
            type: 'radar',
            data: {
                labels: ['CPU利用率', 'GPU利用率', '内存占用(GB)', '稳定性'],
                datasets: [
                    {
                        label: '100QPS',
                        data: [65, 70, 10, 100],
                        borderColor: 'rgba(46, 204, 113, 1)',
                        backgroundColor: 'rgba(46, 204, 113, 0.2)',
                        borderWidth: 2
                    },
                    {
                        label: '150QPS',
                        data: [78, 85, 12, 95],
                        borderColor: 'rgba(241, 196, 15, 1)',
                        backgroundColor: 'rgba(241, 196, 15, 0.2)',
                        borderWidth: 2
                    },
                    {
                        label: '200QPS',
                        data: [90, 95, 14, 75],
                        borderColor: 'rgba(231, 76, 60, 1)',
                        backgroundColor: 'rgba(231, 76, 60, 0.2)',
                        borderWidth: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: '资源利用率对比',
                        font: {
                            size: 16,
                            weight: 'bold'
                        }
                    },
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: {
                                size: 11
                            }
                        }
                    }
                },
                scales: {
                    r: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });
    </script>
</body>
</html>
