<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统稳定性测试结果</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .chart-container {
            position: relative;
            margin: 20px 0;
            height: 400px;
        }
        .large-chart {
            height: 500px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .stability-highlight {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        .stability-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        .incident-box {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #fff;
        }
        .incident-time {
            font-weight: bold;
            font-size: 1.1em;
        }
        .incident-desc {
            margin-top: 5px;
            opacity: 0.9;
        }
        .recovery-time {
            background: rgba(255,255,255,0.2);
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 5px;
        }
        .chart-row {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .chart-col {
            flex: 1;
        }
        .shock-test {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        .shock-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .shock-metrics {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }
        .shock-metric {
            text-align: center;
        }
        .shock-value {
            font-size: 1.5em;
            font-weight: bold;
        }
        .shock-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>系统稳定性测试结果</h1>

        <div class="stability-highlight">
            <div>72小时连续运行稳定性</div>
            <div class="stability-value">99.86%</div>
            <div>系统服务可用性，自动故障转移3秒内恢复</div>
        </div>

        <div class="incident-box">
            <div class="incident-time">第48小时GPU驱动中断事件</div>
            <div class="incident-desc">外部GPU驱动故障导致服务临时中断，系统自动故障转移机制生效</div>
            <div class="recovery-time">⚡ 3秒内自动恢复服务</div>
        </div>

        <div class="chart-container large-chart">
            <canvas id="stabilityChart"></canvas>
        </div>

        <div class="shock-test">
            <div class="shock-title">高负载冲击测试 (100QPS → 300QPS)</div>
            <div class="shock-metrics">
                <div class="shock-metric">
                    <div class="shock-value">350ms</div>
                    <div class="shock-label">平均响应时间</div>
                </div>
                <div class="shock-metric">
                    <div class="shock-value">8%</div>
                    <div class="shock-label">请求失败率</div>
                </div>
                <div class="shock-metric">
                    <div class="shock-value">5分钟</div>
                    <div class="shock-label">恢复时间</div>
                </div>
                <div class="shock-metric">
                    <div class="shock-value">0</div>
                    <div class="shock-label">数据丢失</div>
                </div>
            </div>
        </div>

        <div class="chart-row">
            <div class="chart-col">
                <div class="chart-container">
                    <canvas id="resourceTrendChart"></canvas>
                </div>
            </div>
            <div class="chart-col">
                <div class="chart-container">
                    <canvas id="shockComparisonChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 72小时稳定性主图表
        const ctx1 = document.getElementById('stabilityChart').getContext('2d');

        // 生成72小时的时间标签
        const hours = [];
        const cpuData = [];
        const memoryData = [];
        const gpuData = [];

        for (let i = 0; i <= 72; i += 3) {
            hours.push(i + 'h');
            // 模拟稳定的资源使用率，带有小幅波动
            cpuData.push(65 + Math.random() * 10 + (i === 48 ? 25 : 0)); // 第48小时模拟GPU中断
            memoryData.push(10 + Math.random() * 2);
            gpuData.push(70 + Math.random() * 10 + (i === 48 ? 20 : 0));
        }

        const stabilityChart = new Chart(ctx1, {
            type: 'line',
            data: {
                labels: hours,
                datasets: [
                    {
                        label: 'CPU利用率 (%)',
                        data: cpuData,
                        borderColor: 'rgba(52, 152, 219, 1)',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    },
                    {
                        label: 'GPU利用率 (%)',
                        data: gpuData,
                        borderColor: 'rgba(155, 89, 182, 1)',
                        backgroundColor: 'rgba(155, 89, 182, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    },
                    {
                        label: '内存占用 (GB)',
                        data: memoryData,
                        borderColor: 'rgba(46, 204, 113, 1)',
                        backgroundColor: 'rgba(46, 204, 113, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: '72小时连续运行资源使用趋势',
                        font: {
                            size: 18,
                            weight: 'bold'
                        },
                        padding: 20
                    },
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 15,
                            font: {
                                size: 12
                            }
                        }
                    },
                    annotation: {
                        annotations: {
                            line1: {
                                type: 'line',
                                xMin: 16,
                                xMax: 16,
                                borderColor: 'rgba(255, 99, 132, 0.8)',
                                borderWidth: 2,
                                borderDash: [6, 6],
                                label: {
                                    content: 'GPU驱动中断',
                                    enabled: true,
                                    position: 'start'
                                }
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: '运行时间',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        max: 100,
                        title: {
                            display: true,
                            text: '资源利用率 (%) / 占用 (GB)',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    }
                }
            }
        });

        // 资源稳定性趋势图
        const ctx2 = document.getElementById('resourceTrendChart').getContext('2d');
        const resourceTrendChart = new Chart(ctx2, {
            type: 'line',
            data: {
                labels: ['0h', '12h', '24h', '36h', '48h', '60h', '72h'],
                datasets: [{
                    label: 'CPU利用率',
                    data: [70, 68, 72, 69, 90, 70, 71],
                    borderColor: 'rgba(52, 152, 219, 1)',
                    backgroundColor: 'rgba(52, 152, 219, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: 'CPU稳定性趋势',
                        font: {
                            size: 16,
                            weight: 'bold'
                        }
                    },
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        min: 60,
                        max: 100,
                        title: {
                            display: true,
                            text: '利用率 (%)'
                        }
                    }
                }
            }
        });

        // 高负载冲击对比图
        const ctx3 = document.getElementById('shockComparisonChart').getContext('2d');
        const shockComparisonChart = new Chart(ctx3, {
            type: 'bar',
            data: {
                labels: ['正常运行 (100QPS)', '高负载冲击 (300QPS)'],
                datasets: [
                    {
                        label: '响应时间 (ms)',
                        data: [85, 350],
                        backgroundColor: [
                            'rgba(46, 204, 113, 0.8)',
                            'rgba(231, 76, 60, 0.8)'
                        ],
                        borderColor: [
                            'rgba(46, 204, 113, 1)',
                            'rgba(231, 76, 60, 1)'
                        ],
                        borderWidth: 2
                    },
                    {
                        label: '失败率 (%)',
                        data: [0, 8],
                        backgroundColor: [
                            'rgba(52, 152, 219, 0.8)',
                            'rgba(241, 196, 15, 0.8)'
                        ],
                        borderColor: [
                            'rgba(52, 152, 219, 1)',
                            'rgba(241, 196, 15, 1)'
                        ],
                        borderWidth: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: '高负载冲击影响对比',
                        font: {
                            size: 16,
                            weight: 'bold'
                        }
                    },
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: {
                                size: 11
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: '数值'
                        }
                    }
                }
            }
        });

        // 在第48小时位置添加垂直线标注GPU中断事件
        setTimeout(() => {
            if (stabilityChart.options.plugins.annotation) {
                stabilityChart.options.plugins.annotation.annotations = {
                    line1: {
                        type: 'line',
                        xMin: 16,
                        xMax: 16,
                        borderColor: 'rgba(255, 99, 132, 0.8)',
                        borderWidth: 2,
                        borderDash: [6, 6]
                    }
                };
                stabilityChart.update();
            }
        }, 100);
    </script>
</body>
</html>
